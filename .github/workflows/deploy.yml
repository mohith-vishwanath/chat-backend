name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'test' }}
  AWS_REGION: us-east-1                   # TODO: set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: chat-backend            # TODO: set this to your Amazon ECR repository name
  ECS_SERVICE: chat-backend-service       # TODO: set this to your Amazon ECS service name
  ECS_CLUSTER: chat-backend-cluster       # TODO: set this to your Amazon ECS cluster name
  ECS_TASK_DEFINITION: .aws/task-definition.json # TODO: set this to the path to your Amazon ECS task definition file
  CONTAINER_NAME: ${{ github.ref_type == 'tag' && 'production' || 'test' }}-chat-backend # Set dynamically based on the environment

# This permission setup is strictly required for AWS OIDC authentication
permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Dynamically select the GitHub Environment based on whether the trigger was a tag or a branch
    environment: ${{ github.ref_type == 'tag' && 'production' || 'test' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Authenticate to AWS using OIDC (No Access Keys needed!)
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    # 2. Log in to Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 3. Build and push the Docker image
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and push it to ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # 4. Update the ECS Task Definition with the newly built image
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    # 5. Deploy the updated Task Definition to the ECS Cluster
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
